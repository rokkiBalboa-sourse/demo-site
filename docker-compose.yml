services:
  postgres:
    image: postgres:16-alpine
    container_name: sudostudy_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sudostudy_reports
      POSTGRES_USER: sudostudy_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sudostudy_user -d sudostudy_reports']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sudostudy_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sudostudy_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_min_32_chars}
      APP_URL: ${APP_URL:-https://exam.sudostudy.dev}
      NEXTAUTH_URL: ${APP_URL:-https://exam.sudostudy.dev}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NAME: ${ADMIN_NAME:-Кузнецов Валерий Сергеевич}
    volumes:
      - ./.data:/app/.data
    ports:
      - '${APP_PORT:-3339}:3000'
    networks:
      - sudostudy_net

volumes:
  postgres_data:
    driver: local

networks:
  sudostudy_net:
    driver: bridge
